{% assign item = include.item %}
<div class="group border border-white/10 rounded-2xl p-6 sm:p-8 bg-white/[0.02] hover:bg-white/[0.04] hover:border-white/20 transition-all duration-300 flex flex-col gap-6">
  <div class="grid sm:grid-cols-[100px_1fr] gap-4 sm:gap-6">
    <div class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-indigo-400 tracking-wider uppercase">{{ item.year }}</span>
      <span class="text-xs text-cool-gray">{{ item.type }}</span>
    </div>
    <div class="flex flex-col gap-3">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <a href="{{ item.permalink }}" target="_blank" rel="noopener noreferrer" class="text-2xl sm:text-3xl font-bold text-white hover:text-indigo-300 transition-colors flex items-center gap-2">
          {{ item.title }}
          <span class="material-symbols-outlined !text-xl opacity-0 group-hover:opacity-100 transition-opacity">open_in_new</span>
        </a>
      </div>
      <p class="text-base sm:text-lg text-ghost-white/90 leading-relaxed">{{ item.description }}</p>
      <div class="flex flex-wrap gap-2 pt-2">
        {% assign tech_list = item.tech | split: " / " %}
        {% for t in tech_list %}
        <span class="px-3 py-1 rounded-md text-xs font-mono bg-white/10 text-ghost-white border border-white/10">
          {{ t }}
        </span>
        {% endfor %}
      </div>
    </div>
  </div>
  {% if item.image.src %}
  <a href="{{ item.permalink }}" target="_blank" rel="noopener noreferrer" class="overflow-hidden rounded-xl border border-white/10 block">
    <img src="{{ item.image.src }}" alt="{{ item.image.alt }}" class="w-full aspect-[21/9] object-cover styled-img">
  </a>
  {% endif %}
</div>
